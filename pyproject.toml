[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skunk-pc"
version = "0.1.4"
description = "Servidor local de impresión 4x6 para impresoras térmicas Zebra"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "jinja2>=3.1,<4",
  "itsdangerous>=2.2,<3",
  "python-multipart>=0.0.20,<1",
  "pillow>=11,<13",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
include = ["skunk_pc*"]

[tool.setuptools.package-data]
skunk_pc = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
